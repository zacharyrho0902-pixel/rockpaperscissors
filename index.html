<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
     function getComputerChoice () {
        const randomNumber = Math.random();

        if (randomNumber <= 0.33) {
        return "rock";
          }  else if (randomNumber <= 0.67){
        return "paper";
           } else {return "scissors";
            } 

     }

     function getHumanChoice () {
     const sign = prompt("rock paper or scissors?");
     return sign;
    }

function playGame() {
  let humanScore = 0;
    let computerScore = 0;
    function playRound(humanChoice, computerChoice) {
        const humanChoiceLower = humanChoice.toLowerCase();
        if (humanChoiceLower === computerChoice) {
        console.log("It's a tie!");
    }
        else if (
        (humanChoiceLower === "rock" && computerChoice ==="scissors") ||
        (humanChoiceLower === "scissors" && computerChoice ==="paper") ||
        (humanChoiceLower === "paper" && computerChoice ==="rock")
        ) {
            humanScore++;
            console.log("You win!");
        }
        else {
            computerScore++;
            console.log("You lose!");
        }
}
const round1human = getHumanChoice();
const round1computer = getComputerChoice();
playRound(round1human, round1computer);

const round2human = getHumanChoice();
const round2computer = getComputerChoice();
playRound(round2human, round2computer);

const round3human = getHumanChoice();
const round3computer = getComputerChoice();
playRound(round3human, round3computer);

const round4human = getHumanChoice();
const round4computer = getComputerChoice();
playRound(round4human, round4computer);

const round5human = getHumanChoice();
const round5computer = getComputerChoice();
playRound(round5human, round5computer);

if (humanScore > computerScore) {
    console.log("YOU WON THE GAME!!")
}
else if (computerScore > humanScore) {
    console.log("YOU LOSE!!")
}
else {
    console.log("TIE")
}
}

playGame()

    </script>
</body>
</html>
